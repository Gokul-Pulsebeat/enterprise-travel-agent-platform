# Alembic configuration for the hotel service, used by the CLI:
#   alembic -c hotel_api/alembic.ini upgrade head
#   alembic -c hotel_api/alembic.ini revision --autogenerate -m "describe the change"
# The connection string comes from DATABASE_URL (see common/db.py), never from this file. At service start-up the
# app runs the same migrations programmatically; this file is not used on that path.

[alembic]
script_location = %(here)s/migrations

# Put the repository root on sys.path so env.py can import hotel_api and common.
prepend_sys_path = %(here)s/..
